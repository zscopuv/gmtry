[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gmtry"
version = "1.1"
description = "All you need for geometry. And more."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "zscopuv" }
]
dependencies = [
    "colorama==0.4.6",
    "packaging>=24.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]